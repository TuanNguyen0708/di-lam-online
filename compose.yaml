services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: office
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: office
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["office-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office -d office"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6381:6379"]
    volumes: ["office-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  game:
    profiles: [live]
    build: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3101
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Run pnpm run setup first}
      WEB_ORIGIN: http://localhost:3101
      DATABASE_URL: postgresql://office:${POSTGRES_PASSWORD}@postgres:5432/office
      REDIS_URL: redis://redis:6379
      ROOM_ID: ${ROOM_ID:-office-main}
    ports: ["127.0.0.1:3101:3101"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
volumes:
  office-db:
  office-redis:
