$kind: http-example
request:
  url: "{{baseUrl}}/api/admin/tiktok/connect"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "username": "str"
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 5000
