$kind: http-example
name: Accepted request with gameplay result. Repeated eventId is a no-op within the dedupe window.
request:
  url: "{{baseUrl}}/api/admin/simulate"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "eventId": "string",
        "type": "gift",
        "user": {
          "platformUserId": "string",
          "displayName": "string"
        },
        "payload": {
          "text": "string",
          "count": 1186,
          "giftId": "string"
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "ok": true,
        "message": "string",
        "duplicate": true
      }
order: 1000
